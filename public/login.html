<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log in · 3duiq SessionLens</title><link rel="icon" type="image/png" href="/assets/sessionlens-logo-v2.png" />
    <link rel="stylesheet" href="/account.css" />
    <script src="/access.js"></script>
    <script src="/login.js" defer></script>
  </head>
  <body class="auth-layout">
    <aside class="auth-art">
      <a class="brand" href="/"><img class="brand-mark" src="/assets/sessionlens-logo-v2.png" alt="" width="36" height="36" />3duiq SessionLens</a>
      <span class="eyebrow">SESSION INTELLIGENCE</span>
      <h2>See the journey.<br />Understand the experience.</h2>
      <p>Explore session analytics, visitor journeys and replay in your workspace.</p>
    </aside>
    <div class="auth-form-wrap">
      <main class="auth card">
        <div class="eyebrow">WORKSPACE</div>
        <h1>Welcome back</h1>
        <p>Log in to explore your dashboard.</p>
        <form id="login-form">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            maxlength="254"
            required
          />
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="128"
            required
          />
          <button id="submit" type="submit">Log in</button>
        </form>
        <p id="feedback" role="status" aria-live="polite"></p>
        <p class="auth-note">Session analytics and replay in one workspace.</p>
      </main>
    </div>
  </body>
</html>
